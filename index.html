<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAGIA</title>
  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollToPlugin.min.js"></script>
  <!-- Lottie Player -->
  <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: black;
      overflow-x: hidden;
    }
    .wrapper, .content {
      position: relative;
      width: 100%;
    }
    .content .section {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 1s ease-out, transform 1s ease-out;
      position: relative; /* For positioning the floor number */
    }
    .content .section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Floor number indicator */
    .floor-number {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      background-color: black;
      border: 2px solid white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      z-index: 5;
    }

    /* Horizontal line through floor number */
    .floor-line {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: white;
      z-index: 4;
    }

    .image-container {
      width: 100%;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      perspective: 500px;
      overflow: hidden;
    }
    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Elevator door styles - with white fill and black border */
    .elevator-door-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 98%;
      height: 100vh;
      z-index: 10;
      overflow: hidden;
      pointer-events: none;
    }
    .door-left, .door-right {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      z-index: 10;
      background-color: white; /* White background fill */
      border: 2px solid black; /* Black outline */
    }
    .door-left {
      left: 0;
      border-right: 3px solid black; /* Thicker border where doors meet */
    }
    .door-right {
      right: 0;
      border-left: 3px solid black; /* Thicker border where doors meet */
    }

    /* Responsive styles for lottie player */
    dotlottie-player {
      width: 90vw;
      height: 50vh;
    }

    /* Fixed section1 flexbox layout */
    #section1 {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      width: 100%;
      gap: 20px;
      flex-wrap: wrap;
    }

    #section1 dotlottie-player {
      flex: 1;
      min-width: 300px;
      max-width: 600px;
    }

    #section1 img {
      height: auto;
      max-width: 40%;
      min-width: 200px;
      object-fit: contain;
    }

    #section2 {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      width: 100%;
      gap: 20px;
      flex-wrap: wrap;
    }

    #section2 dotlottie-player {
      flex: 1;
      min-width: 300px;
      max-width: 600px;
    }

    #section2 img {
      height: auto;
      max-width: 40%;
      min-width: 200px;
      object-fit: contain;
    }

    /* Fixed section3 flexbox layout */
    #section3 {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    #section3 img {
      height: auto;
      max-width: 40%;
      min-width: 200px;
      object-fit: contain;
    }

    #section3 dotlottie-player {
      flex: 1;
      min-width: 300px;
      max-width: 600px;
    }

    #section4 {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      width: 100%;
      gap: 20px;
      flex-wrap: wrap;
    }

    #section4 dotlottie-player {
      flex: 1;
      min-width: 300px;
      max-width: 600px;
    }

    #section4 img {
      height: auto;
      max-width: 40%;
      min-width: 200px;
      object-fit: contain;
    }

    /* Lift Navigation Styles */
    .lift-nav {
      position: fixed;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 999; /* Higher than other elements */
      display: flex;
      flex-direction: column;
      gap: 20px;
      opacity: 0; /* Start hidden */
      visibility: hidden; /* Completely hidden initially */
      transition: opacity 0.8s ease, visibility 0.8s ease; /* Smooth transition */
    }

    .lift-nav.visible {
      opacity: 1;
      visibility: visible;
    }

    .lift-nav-item {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 3px solid #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      font-weight: bold;
      background-color: white;
      color: #000;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .lift-nav-item:hover {
      transform: scale(1.1);
    }

    .lift-nav-item.active {
      background-color: #9575cd;
      color: white;
    }

    /* Media Queries for Responsive Design */
    /* Mobile devices (portrait) */
    @media only screen and (max-width: 576px) {
      dotlottie-player {
        width: 90vw;
        height: 40vh;
      }

      .door-left, .door-right {
        border-width: 1px; /* Thinner border for small screens */
      }

      .door-left {
        border-right-width: 2px; /* Still slightly thicker where doors meet */
      }

      .door-right {
        border-left-width: 2px;
      }

      .elevator-door-container {
        width: 95%;
      }

      #section1, #section2, #section3, #section4 {
        flex-direction: column;
      }

      #section1 img, #section2 img, #section3 img, #section4 img {
        max-width: 80%;
      }

      .lift-nav {
        left: 15px;
      }

      .lift-nav-item {
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
      }

      .floor-number {
        width: 50px;
        height: 50px;
        font-size: 1.6rem;
        top: 15px;
      }

      .floor-line {
        top: 40px;
      }
    }

    /* Tablets and larger mobile (landscape) */
    @media only screen and (min-width: 577px) and (max-width: 991px) {
      dotlottie-player {
        width: 80vw;
        height: 45vh;
      }

      .door-left, .door-right {
        border-width: 2px;
      }

      .door-left {
        border-right-width: 3px;
      }

      .door-right {
        border-left-width: 3px;
      }

      .lift-nav {
        left: 20px;
      }
    }

    /* Desktop */
    @media only screen and (min-width: 992px) {
      dotlottie-player {
        width: 70vw;
        max-width: 800px;
        height: 50vh;
      }

      .door-left, .door-right {
        border-width: 3px;
      }

      .door-left {
        border-right-width: 4px;
      }

      .door-right {
        border-left-width: 4px;
      }
    }
  </style>
</head>
<body>
  <!-- Lift Navigation -->
  <div class="lift-nav">
    <div class="lift-nav-item" data-section="section1">1</div>
    <div class="lift-nav-item" data-section="section2">2</div>
    <div class="lift-nav-item" data-section="section3">3</div>
    <div class="lift-nav-item" data-section="section4">4</div>
  </div>

  <div class="wrapper">
    <div class="content">
      <section id="section1" class="section">
        <!-- Floor number indicator -->
        <div class="floor-line"></div>
        <div class="floor-number">1</div>

        <div class="elevator-door-container">
          <div class="door-left"></div>
          <div class="door-right"></div>
        </div>
        <img src="Artboard 221@4x.png" alt="Artboard 7">
        <dotlottie-player src="https://lottie.host/b819d221-150e-4051-8d33-58c33707e552/s9JUEeLPKf.lottie" background="transparent" speed="1" loop autoplay></dotlottie-player>
      </section>
      <section id="section2" class="section">
        <!-- Floor number indicator -->
        <div class="floor-line"></div>
        <div class="floor-number">2</div>

        <dotlottie-player src="https://lottie.host/25d43b81-4abf-47ae-9215-5e4eefd0872d/NOCMfYflV4.lottie" background="transparent" speed="1" loop autoplay></dotlottie-player>
        <img src="2@4x.png" alt="">
      </section>
      <section id="section3" class="section">
        <!-- Floor number indicator -->
        <div class="floor-line"></div>
        <div class="floor-number">3</div>

        <img src="Artboard 231@4x.png" alt="Artboard 9">
        <dotlottie-player src="https://lottie.host/b65689a2-b35c-46f1-b12e-7816392fce62/2k3XNk5MpJ.lottie" background="transparent" speed="1" loop autoplay></dotlottie-player>
      </section>
      <section id="section4" class="section">
        <!-- Floor number indicator -->
        <div class="floor-line"></div>
        <div class="floor-number">4</div>

        <dotlottie-player src="https://lottie.host/605399ae-490a-474d-9f7b-a47762e01f74/b622o8dMwT.lottie" background="transparent" speed="1" loop autoplay></dotlottie-player>
        <img src="Artboard 20.svg" alt="">
      </section>
    </div>

    <div class="image-container">
      <img src="intro.png" alt="image">
    </div>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);

    // Function to handle scroll animation with responsive considerations
    function initScrollAnimation() {
      // Check if any previous instances exist and kill them
      if (ScrollTrigger.getAll().length > 0) {
        ScrollTrigger.getAll().forEach(trigger => trigger.kill());
      }

      // Main timeline with ScrollTrigger
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: ".wrapper",
          start: "top top",
          end: "+=500%", // Dramatically increased scroll distance
          pin: true,
          scrub: 3, // Much higher scrub value for extremely smooth, delayed animation
          invalidateOnRefresh: true, // Important for responsive behavior
          id: "scrolltrigger-main", // Add ID for easier reference
          onUpdate: function(self) {
            // Update active navigation based on scroll position
            const navItems = document.querySelectorAll('.lift-nav-item');
            const progress = self.progress * 4; // Scale to 0-4 range for four sections

            // Only update navigation highlight after zoom animation is complete
            // The zoom animation completes at approximately 20-25% of the total scroll (0.8-1.0 on our 0-4 scale)
            // Keep section 1 active until progress passes threshold
            let activeIndex;

            if (progress < 4.0) {
              // Keep section 1 highlighted during the zoom animation
              activeIndex = 0;
            } else {
              // After zoom is complete, highlight based on scroll position
              activeIndex = Math.min(Math.floor(progress), 3); // Keep within 0-3 range
            }

            navItems.forEach((item, index) => {
              if (index === activeIndex) {
                item.classList.add('active');
              } else {
                item.classList.remove('active');
              }
            });
          }
        }
      });

      // Set initial position - ensure doors are visible at start
      gsap.set([".door-left", ".door-right"], {
        autoAlpha: 1,
        x: 0 // Reset position in case of resize
      });

      // Hide lift nav initially
      gsap.set(".lift-nav", {
        autoAlpha: 0
      });

      // 1. Door opening animation
      tl.to(".door-left", {
        x: "-100%",
        duration: 3,
        ease: "power1.inOut"
      }, 0)
      .to(".door-right", {
        x: "100%",
        duration: 3,
        ease: "power1.inOut"
      }, 0)

      // IMPORTANT: Make lift nav appear exactly when doors finish opening
      .to(".lift-nav", {
        autoAlpha: 1,
        duration: 0.5,
        ease: "power1.inOut",
        onComplete: function() {
          document.querySelector('.lift-nav').classList.add('visible');
        }
      }, "+=0.1") // Small offset after doors finish

      // Adding a small pause after navigation appears
      .to({}, {duration: 0.8})

      // 2. Zoom animation
      .to(".image-container img", {
        scale: 3,
        z: 350,
        duration: 4,
        transformOrigin: "center center",
        ease: "power1.inOut"
      }, "+=0.5")

      // 3. Section scale animation - coordinated with zoom
      .to(".section:first-child", {
        scale: 1.1,
        duration: 4,
        transformOrigin: "center center",
        ease: "power1.inOut"
      }, "<");
    }

    // Initialize animation on load
    window.addEventListener("load", function() {
      initScrollAnimation();

      // Force the section1 to be visible after a short delay
      setTimeout(function() {
        document.getElementById('section1').classList.add('visible');
      }, 500);
    });

    // Reinitialize on window resize with debounce
    let resizeTimer;
    window.addEventListener("resize", function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(initScrollAnimation, 250);
    });

    document.addEventListener("DOMContentLoaded", function () {
      const sections = document.querySelectorAll(".section");

      // Create observer for sections for general visibility
      const sectionsObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            setTimeout(() => {
              entry.target.classList.add("visible");
            }, 300);
          }
        });
      }, { threshold: 0.1 });

      // Observe all sections
      sections.forEach(section => sectionsObserver.observe(section));

      // Initialize lift navigation
      const navItems = document.querySelectorAll('.lift-nav-item');
      const liftNav = document.querySelector('.lift-nav');

      // Set first nav item as active by default
      navItems[0].classList.add('active');

      // Handle click events on navigation items
      navItems.forEach(item => {
        item.addEventListener('click', function() {
          const targetSection = this.getAttribute('data-section');
          const sectionIndex = parseInt(targetSection.replace('section', '')) - 1;

          // Calculate position based on the animation timeline
          const progress = sectionIndex / 4; // 4 sections total, normalize to 0-1
          const scrollTrigger = ScrollTrigger.getById('scrolltrigger-main') || ScrollTrigger.getAll()[0];

          if (scrollTrigger) {
            scrollTrigger.scroll(progress * (scrollTrigger.end - scrollTrigger.start));
          } else {
            // Fallback if ScrollTrigger isn't working
            const scrollDistance = window.innerHeight * sectionIndex;
            window.scrollTo({
              top: scrollDistance,
              behavior: 'smooth'
            });
          }

          // Update active state
          navItems.forEach(nav => nav.classList.remove('active'));
          this.classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
