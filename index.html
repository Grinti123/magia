<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGIA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="preloader">
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>
    <div class="loading-text">Loading</div>
</div>

    <!-- Parallax container for scrolling space -->
    <div class="parallax-container"></div>

    <!-- Intro section for GSAP zoom effect -->
    <div id="intro">
        <div class="intro-content">
            <img class="intro-img" src="intro.png" alt="">
            <div class="elevator-door-container">
                <div class="door-left"></div>
                <div class="door-right"></div>
            </div>
            <div class="text-container">
                <p class="intro-subtitle">Scroll down</p>
                <div class="scroll-indicator">↓</div>
            </div>
        </div>
    </div>

    <!-- Progress bar -->
    <div id="progressBar">
        <div id="progress"></div>
    </div>

    <!-- Main elevator content -->
    <div class="container closed" id="scene">
        <div class="doors">
            <div class="door left-door"></div>
            <div class="door right-door"></div>
        </div>
        <section id="section1" class="section active">
            <div class="floor-line"></div>
            <div class="floor-number">1</div>
            <div class="content-container">
                <img src="Artboard 221@4x.png" alt="Artboard 7">
                <div id="dottie1" class="lottie-container"></div>
            </div>
        </section>
        <section id="section2" class="section">
            <div class="floor-line"></div>
            <div class="floor-number">2</div>
            <div class="content-container">
                <div id="dottie2" class="lottie-container"></div>
                <img src="2@4x.png" alt="">
            </div>
        </section>
        <section id="section3" class="section">
            <div class="floor-line"></div>
            <div class="floor-number">3</div>
            <div class="content-container">
                <img src="Artboard 231@4x.png" alt="Artboard 9">
                <div id="dottie3" class="lottie-container"></div>
            </div>
        </section>
        <section id="section4" class="section">
            <div class="floor-line"></div>
            <div class="floor-number">4</div>
            <div class="content-container">
                <div id="dottie4" class="lottie-container"></div>
                <img src="Artboard 20.svg" alt="">
            </div>
        </section>
        <div class="btn-container">
            <button class="btn-lift active" onclick="goToFloor(0)">1</button>
            <button class="btn-lift" onclick="goToFloor(1)">2</button>
            <button class="btn-lift" onclick="goToFloor(2)">3</button>
            <button class="btn-lift" onclick="goToFloor(3)">4</button>
        </div>
    </div>
    <script src="scripts.js"></script>
    </body>
</html>
