<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAGIA</title>
  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
  <!-- Lottie Player -->
  <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: black;
      overflow-x: hidden;
    }
    .wrapper, .content {
      position: relative;
      width: 100%;
    }
    .content .section {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 1s ease-out, transform 1s ease-out;
    }
    .content .section.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .image-container {
      width: 100%;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      perspective: 500px;
      overflow: hidden;
    }
    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Elevator door styles */
    .elevator-door-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 10;
      overflow: hidden;
      pointer-events: none;
    }
    .door-left, .door-right {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      z-index: 10;
    }
    .door-left {
      top: -3rem;
      left: 317px;
    }
    .door-right {
      top: -3rem;
      right: 317px;
    }
    .door-left img, .door-right img {
      height: 100%;
      width: 100%;
      object-fit: cover;
    }
    dotlottie-player {
      width: 90vw;
      max-width: 800px;
      height: 50vh;
    }

    @media (max-width: 320px) {
      .door-left {
      top: -3rem;
      left: 84px;
    }
    .door-right {
      top: -3rem;
      right: 84px;
    }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="content">
      <section class="section">
        <div class="elevator-door-container">
          <div class="door-left">
            <img src="left-door.png" alt="Left Door">
          </div>
          <div class="door-right">
            <img src="right-door.png" alt="Right Door">
          </div>
        </div>
        <dotlottie-player src="https://lottie.host/b819d221-150e-4051-8d33-58c33707e552/s9JUEeLPKf.lottie" background="transparent" speed="1" style="width: 50vw; height: 50vh" loop autoplay></dotlottie-player>
      </section>
      <section class="section">
        <dotlottie-player src="https://lottie.host/25d43b81-4abf-47ae-9215-5e4eefd0872d/NOCMfYflV4.lottie" background="transparent" speed="1" style="width: 50vw; height: 50vh" loop autoplay></dotlottie-player>
      </section>
      <section class="section">
        <dotlottie-player src="https://lottie.host/b65689a2-b35c-46f1-b12e-7816392fce62/2k3XNk5MpJ.lottie" background="transparent" speed="1" style="width: 50vw; height: 50vh" loop autoplay></dotlottie-player>
      </section>
      <section class="section">
        <dotlottie-player src="https://lottie.host/605399ae-490a-474d-9f7b-a47762e01f74/b622o8dMwT.lottie" background="transparent" speed="1" style="width: 50vw; height: 50vh" loop autoplay></dotlottie-player>
      </section>
    </div>

    <div class="image-container">
      <img src="intro.png" alt="image">
    </div>

    <!-- Elevator door elements properly contained -->

  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    window.addEventListener("load", () => {
      // Main timeline with ScrollTrigger
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: ".wrapper",
          start: "top top",
          end: "+=150%",
          pin: true,
          scrub: true
        }
      });

      // First add elevator door opening animation - slide to sides
      tl.to(".door-left", {
        x: "-100%",
        duration: 1,
        ease: "power2.inOut"
      }, 0)
      .to(".door-right", {
        x: "100%",
        duration: 1,
        ease: "power2.inOut"
      }, 0)

      // Then continue with the original animations
      .to(".image-container img", {
        scale: 3,
        z: 350,
        transformOrigin: "center center",
        ease: "power1.inOut"
      })
      .to(".section:first-child", {
        scale: 1.1,
        transformOrigin: "center center",
        ease: "power1.inOut"
      }, "<");
    });

    // Smooth fade-in using IntersectionObserver
    document.addEventListener("DOMContentLoaded", function () {
      const sections = document.querySelectorAll(".section");
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
          }
        });
      }, { threshold: 0.2 });
      sections.forEach(section => observer.observe(section));
    });
  </script>
</body>
</html>
